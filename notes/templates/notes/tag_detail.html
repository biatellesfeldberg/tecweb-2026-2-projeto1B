{% extends "notes/base.html" %}
{% load static %}

{% block content %}
    <div class="appbar">
      <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
      <a href="{% url 'tags' %}" class="appbar-link">Tags</a>
    </div>

    <main class="container">
      <div class="card-container">
        {% for note in notes %}
        <div class="card">
          <a href="{% url 'edit' id=note.id %}" class="card-edit">
            <span class="material-icons">edit</span>
          </a>
          <a href="{% url 'delete' id=note.id %}" class="card-remove">
            <span class="material-icons">delete</span>
          </a>
          <h3 class="card-title">{{ note.title }}</h3>
          <div class="card-content">
            <p>{{ note.content }}</p>
          </div>
          {% if note.tag %}
          <span class="card-tag">#{{ note.tag.name }}</span>
          {% endif %}
        </div>
        {% endfor %}
      </div>
    </main>
{% endblock %}
